[package]
edition.workspace = true
name = "mokmok-event-store"
version.workspace = true

[package.metadata.mokmok]
purity = "adapter"

[dependencies]
mokmok-protocol = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["raw_value", "std"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["std", "v4", "v7"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "mokmok-event-store-crash"
path = "src/bin/mokmok-event-store-crash.rs"
