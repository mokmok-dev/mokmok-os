name: nix
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-nix
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  check:
    timeout-minutes: 45
    # macos-latest is arm64, exercising aarch64-darwin and the case-insensitive
    # file system the filename hash exists for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - if: matrix.os == 'ubuntu-latest'
        run: nix flake check --print-build-logs
      # The pre-commit check's Darwin closure builds Swift from source; the test
      # check is the one that exercises the case-insensitive file system.
      - if: matrix.os == 'macos-latest'
        run: nix build .#checks.aarch64-darwin.test --print-build-logs
