[workspace]
members = [
  "crates/mokmok-jobs",
  "crates/mokmok-jobs-core",
  "crates/mokmok-jobs-jsonl",
  "crates/mokmok-jobs-memory",
]
resolver = "3"

[workspace.dependencies]
mokmok-jobs = { path = "crates/mokmok-jobs" }
mokmok-jobs-core = { path = "crates/mokmok-jobs-core" }
mokmok-jobs-jsonl = { path = "crates/mokmok-jobs-jsonl" }
mokmok-jobs-memory = { path = "crates/mokmok-jobs-memory" }
proptest = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateright = "0.31.0"
tempfile = "3"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "deny"

[workspace.metadata.crane]
name = "mokmok-os"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2026.11.1"
