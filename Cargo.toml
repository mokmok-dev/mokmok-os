[workspace]
members = [
  "crates/mokmok-acp",
  "crates/mokmok-control",
  "crates/mokmok-control-core",
  "crates/mokmok-controld",
  "crates/mokmok-events",
  "crates/mokmok-jobs",
  "crates/mokmok-jobs-core",
  "crates/mokmok-jobs-jsonl",
  "crates/mokmok-jobs-memory",
  "crates/mokmok-proofs",
]
resolver = "3"

[workspace.dependencies]
agent-client-protocol-schema = { version = "0.10", features = ["unstable"] }
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
mokmok-acp = { path = "crates/mokmok-acp" }
mokmok-control = { path = "crates/mokmok-control" }
mokmok-control-core = { path = "crates/mokmok-control-core" }
mokmok-controld = { path = "crates/mokmok-controld" }
mokmok-events = { path = "crates/mokmok-events" }
mokmok-jobs = { path = "crates/mokmok-jobs" }
mokmok-jobs-core = { path = "crates/mokmok-jobs-core" }
mokmok-jobs-jsonl = { path = "crates/mokmok-jobs-jsonl" }
mokmok-jobs-memory = { path = "crates/mokmok-jobs-memory" }
mokmok-proofs = { path = "crates/mokmok-proofs" }
proptest = "1.12.0"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
stateright = "0.31.0"
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "deny"

[workspace.metadata.crane]
name = "mokmok-os"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2026.11.1"
