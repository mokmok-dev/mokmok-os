[workspace]
members = ["mokmok-protocol"]
resolver = "3"

[workspace.dependencies]
proptest = "1.12.0"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
uuid = { version = "1.28.0", default-features = false }

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.metadata.crane]
name = "mokmok-os"

# Not the default `test` profile: `cargo mutants` only ever rebuilds, so drop
# debug info to speed up linking (see .cargo/mutants.toml).
[profile.mutants]
debug = "none"
inherits = "test"
