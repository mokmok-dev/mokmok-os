[workspace]
members = [
  "mokmok-agent-runtime",
  "mokmok-artifact",
  "mokmok-capability",
  "mokmok-egress",
  "mokmok-event-bus",
  "mokmok-event-store",
  "mokmok-kernel",
  "mokmok-observability",
  "mokmok-protocol",
  "mokmok-sandbox",
  "mokmok-scheduler",
  "mokmok-state-machine",
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.9"
clap = "4.6.7"
futures-util = "0.3.34"
landlock = "0.4"
mokmok-agent-runtime = { path = "mokmok-agent-runtime" }
mokmok-artifact = { path = "mokmok-artifact" }
mokmok-capability = { path = "mokmok-capability" }
mokmok-egress = { path = "mokmok-egress" }
mokmok-event-bus = { path = "mokmok-event-bus" }
mokmok-event-store = { path = "mokmok-event-store" }
mokmok-observability = { path = "mokmok-observability" }
mokmok-protocol = { path = "mokmok-protocol" }
mokmok-sandbox = { path = "mokmok-sandbox" }
mokmok-scheduler = { path = "mokmok-scheduler" }
mokmok-state-machine = { path = "mokmok-state-machine" }
nix = { version = "0.30", default-features = false, features = [
  "fs",
  "process",
  "resource",
  "signal",
] }
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", default-features = false }

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.metadata.crane]
name = "mokmok-os"

# Not the default `test` profile: `cargo mutants` only ever rebuilds, so drop
# debug info to speed up linking (see .cargo/mutants.toml).
[profile.mutants]
debug = "none"
inherits = "test"
