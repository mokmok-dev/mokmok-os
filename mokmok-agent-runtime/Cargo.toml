[package]
edition.workspace = true
name = "mokmok-agent-runtime"
version.workspace = true

[dependencies]
mokmok-protocol = { workspace = true }
mokmok-state-machine = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "std", "v5", "v7"] }

[dev-dependencies]
proptest = { workspace = true }
# `sync` keeps the `.clippy.toml` guard types reachable; no test uses tokio::sync.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
