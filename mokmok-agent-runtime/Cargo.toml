[package]
edition.workspace = true
name = "mokmok-agent-runtime"
version.workspace = true

[dependencies]
mokmok-protocol = { workspace = true }
mokmok-state-machine = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
